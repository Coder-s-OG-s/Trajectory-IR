name: PR Approval Label Apply

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["PR Approval Label"]
    types: [completed]

jobs:
  apply-label:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add "Need Another Approval" label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // pull_requests is empty for fork PRs, so fall back to the
            // number in the run name. A fork can influence that name, so the
            // PR is checked against the API before labelling.
            const run = context.payload.workflow_run
            const match = /^PR Approval Label #(\d+)$/.exec(run.display_title)
            const issue_number =
              run.pull_requests?.[0]?.number ?? (match ? Number(match[1]) : null)
            if (!issue_number) {
              core.setFailed('Could not resolve PR number from payload or run name')
              return
            }
            const { owner, repo } = context.repo

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            })
            if (pr.state !== 'open') {
              core.info(`PR #${issue_number} is not open, skipping`)
              return
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: issue_number }
            )

            // Latest approval/changes-requested/dismissed review per user,
            // and only from people with repo access.
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR']
            const latest = new Map()
            for (const r of reviews) {
              if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) continue
              if (!trusted.includes(r.author_association)) continue
              latest.set(r.user.login, r.state)
            }
            if (![...latest.values()].includes('APPROVED')) {
              core.info(`PR #${issue_number} has no current approval, skipping`)
              return
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['Need Another Approval']
            })
