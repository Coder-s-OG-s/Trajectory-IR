name: PR Approval Label

# Fork PRs get a read-only token on pull_request_review, so this workflow
# only records the PR number in its run name. pr-approval-label-apply.yml
# runs in the base repo via workflow_run and adds the label.
run-name: PR Approval Label #${{ github.event.pull_request.number }}

permissions:
  contents: read

on:
  pull_request_review:
    types: [submitted]

jobs:
  label-approval:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Record approval
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Approval on PR $PR_NUMBER"
