name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dco-check
        run: pip install --upgrade pip dco-check

      - name: Verify Signed-off-by on PR commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dco-check --verbose

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check pkg drivers client test conformance examples

      - name: Ruff format check
        run: ruff format --check pkg drivers client test conformance examples

      - name: Mypy
        run: mypy pkg/trajectory_ir

      - name: Cross language hash goldens (Python)
        run: pytest test/unit/test_hash_vectors.py test/unit/test_node_identity.py -q

      - name: Unit tests
        run: pytest test/unit -q

      - name: E2E crash/resume tests
        run: pytest test/e2e -q

      - name: Conformance R01/R02
        run: pytest conformance/ -q

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go/go.sum

      - name: Cross language hash goldens (Go)
        working-directory: go
        run: go test ./trajir/nodes -count=1 -run 'TestHashVectors|TestKeyOrder'

      - name: Test Go IR core
        working-directory: go
        run: go test ./... -count=1

      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
