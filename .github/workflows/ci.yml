name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Coverage floors (Phase A). Raise only after measured green baselines improve.
  PYTHON_COV_FAIL_UNDER: "80"
  GO_COV_FAIL_UNDER: "50"

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dco-check
        run: pip install --upgrade pip dco-check

      # Dependabot signs as support@github.com but authors as
      # 49699333+dependabot[bot]@users.noreply.github.com. dco-check treats that
      # as missing sign-off. Skip bot commits; humans still require matching DCO.
      - name: Verify Signed-off-by on PR commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dco-check --verbose \
            --exclude-emails "49699333+dependabot[bot]@users.noreply.github.com,dependabot[bot]@users.noreply.github.com,support@github.com" \
            --exclude-pattern "dependabot\\[bot\\]"

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check pkg drivers client test conformance examples

      - name: Ruff format check
        run: ruff format --check pkg drivers client test conformance examples

      - name: Mypy
        run: mypy pkg/trajectory_ir

      - name: Cross language hash goldens (Python)
        run: pytest test/unit/test_hash_vectors.py test/unit/test_node_identity.py -q

      - name: Unit tests with coverage floor
        run: |
          pytest test/unit -q \
            --cov=trajectory_ir \
            --cov=drivers \
            --cov=client \
            --cov-report=term \
            --cov-report=xml:coverage-python.xml \
            --cov-fail-under=${{ env.PYTHON_COV_FAIL_UNDER }}

      - name: Upload Python coverage (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage-python.xml
          if-no-files-found: ignore

      - name: E2E crash/resume tests
        run: pytest test/e2e -q

      - name: Conformance R01–R08
        run: pytest conformance/ -q

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel into clean environment and smoke import
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --upgrade pip
          .venv-smoke/bin/pip install dist/trajectory_ir-*.whl
          .venv-smoke/bin/python -c "\
          import trajectory_ir; \
          from trajectory_ir.runtime.nodes import Node; \
          from trajectory_ir.storage import FileSystemCAS, content_hash; \
          assert content_hash(b'') == 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'; \
          print('package smoke ok', getattr(trajectory_ir, '__file__', 'n/a'))"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  security-pip-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          # Hosted images can ship an older setuptools that pip-audit flags.
          pip install -U "setuptools>=83"
          pip install -e ".[dev]"
          pip install -U pip-audit

      - name: Run pip-audit on installed dependency tree
        run: |
          # --skip-editable: local trajectory-ir is not a published PyPI release.
          pip-audit --skip-editable

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: go/go.sum

      - name: Cross language hash goldens (Go)
        working-directory: go
        run: go test ./trajir/nodes -count=1 -run 'TestHashVectors|TestKeyOrder'

      - name: Test Go IR core with coverage floor
        env:
          GO_COV_FAIL_UNDER: ${{ env.GO_COV_FAIL_UNDER }}
        run: |
          chmod +x scripts/check_go_coverage.sh
          scripts/check_go_coverage.sh

      - name: Full Go test suite
        working-directory: go
        run: go test ./... -count=1

      - name: Upload Go coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: go/coverage.out
          if-no-files-found: ignore

      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Phase B: real service integrations (separate from Quality so Phase A stays fast).
  integration-postgres:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: trajir
          POSTGRES_PASSWORD: trajir
          POSTGRES_DB: trajir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trajir -d trajir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRAJIR_DATABASE_URL: postgresql://trajir:trajir@localhost:5432/trajir
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with Postgres extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Live Postgres NodeLog tests
        run: pytest test/integration/test_postgres_live.py -q

  integration-minio:
    name: Integration (MinIO)
    runs-on: ubuntu-latest
    env:
      TRAJIR_S3_ENDPOINT_URL: http://127.0.0.1:9000
      TRAJIR_S3_BUCKET: trajir
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z \
            server /data --console-address ":9001"
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with S3 extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,s3]"

      - name: Live MinIO S3 CAS tests
        run: pytest test/integration/test_s3_minio_live.py -q
