name: Release

on:
  push:
    tags:
      - "v*"

# Workflow default is read-only. Write scopes are job-scoped so OpenSSF
# Scorecard Token-Permissions does not treat the whole workflow as write.
permissions:
  contents: read

jobs:
  python-dist:
    name: Build Python dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip "build==1.6.1" "twine==7.0.0"
          python -m build
          twine check dist/*

      # Pinned release tarball + sha256 (Scorecard Pinned-Dependencies / #375).
      # Avoid curl|sh installers that float with main.
      - name: Generate SBOMs with syft
        env:
          SYFT_VERSION: "1.52.0"
          SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors -o syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz -C /usr/local/bin syft
          rm -f syft.tgz
          syft version
          syft dir:. -o cyclonedx-json=dist/sbom-repo.cdx.json
          syft dir:go -o cyclonedx-json=dist/sbom-go.cdx.json
          syft dir:pkg -o cyclonedx-json=dist/sbom-python-src.cdx.json

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach dist and SBOMs to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
