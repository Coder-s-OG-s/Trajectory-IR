name: Release

on:
  push:
    tags:
      - "v*"

# Workflow default is read-only. Write scopes are job-scoped so OpenSSF
# Scorecard Token-Permissions does not treat the whole workflow as write.
permissions:
  contents: read

jobs:
  python-dist:
    name: Build Python dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation (Scorecard Signed-Releases).
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r .github/ci-requirements/release-build.txt
          python -m build
          twine check dist/*

      # Pinned release tarball + sha256 (Scorecard Pinned-Dependencies / #375).
      # Avoid curl|sh installers that float with main.
      - name: Generate SBOMs with syft
        env:
          SYFT_VERSION: "1.52.0"
          SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors -o syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
          sudo mv syft /usr/local/bin/syft
          rm -f syft.tgz
          syft version
          syft dir:. -o cyclonedx-json=dist/sbom-repo.cdx.json
          syft dir:go -o cyclonedx-json=dist/sbom-go.cdx.json
          syft dir:pkg -o cyclonedx-json=dist/sbom-python-src.cdx.json

      # Sign provenance for every release file with Sigstore and attach the
      # bundle to the release so Scorecard Signed-Releases can see it.
      # Verify with: gh attestation verify <file> --repo Coder-s-OG-s/Trajectory-IR
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Add provenance bundle to dist
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/trajectory_ir-${GITHUB_REF_NAME}.sigstore.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach dist and SBOMs to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    needs: python-dist
    if: vars.ENABLE_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download the dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-dist
          path: dist

      - name: Keep the wheel and sdist
        run: |
          set -euo pipefail
          mkdir -p publish
          cp dist/*.whl dist/*.tar.gz publish/

      # PyPI uploads cannot be replaced. Publish only a final vX.Y.Z tag, and
      # only when it matches the version the wheel and sdist were built with.
      - name: Check tag and package version
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a final X.Y.Z tag, skipping the PyPI upload"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          wheels=(publish/*.whl)
          sdists=(publish/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected one wheel and one sdist, got ${#wheels[@]} and ${#sdists[@]}"
            exit 1
          fi
          wheel_version="$(basename "${wheels[0]}" | cut -d- -f2)"
          sdist_name="$(basename "${sdists[0]}" .tar.gz)"
          sdist_version="${sdist_name##*-}"
          if [ "$wheel_version" != "$version" ] || [ "$sdist_version" != "$version" ]; then
            echo "::error::tag $TAG does not match the package version (wheel $wheel_version, sdist $sdist_version). Bump version in pyproject.toml and tag again."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.guard.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish
