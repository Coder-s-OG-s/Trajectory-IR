version: 2
updates:
  # DCO CI skips dependabot[bot] authors (sign-off email cannot match the bot
  # noreply author). Prefer grouped Action bumps to avoid thrashing ci.yml.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
