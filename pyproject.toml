[project]
name = "trajectory-ir"
version = "0.2.1"
description = "Portable, hash-verifiable intermediate representation for agent runs (seals, effects, .tir packages)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Coder-s-OG-s contributors" },
]
keywords = [
    "agent",
    "trajectory",
    "intermediate-representation",
    "durable-execution",
    "tir",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "dbos",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pip-audit", "rfc8785"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool", "rfc8785"]
s3 = ["boto3", "rfc8785"]
rfc8785 = ["rfc8785"]

[project.urls]
Homepage = "https://github.com/Coder-s-OG-s/Trajectory-IR"
Repository = "https://github.com/Coder-s-OG-s/Trajectory-IR"
Issues = "https://github.com/Coder-s-OG-s/Trajectory-IR/issues"
Changelog = "https://github.com/Coder-s-OG-s/Trajectory-IR/blob/main/CHANGELOG.md"
Release = "https://github.com/Coder-s-OG-s/Trajectory-IR/releases/tag/v0.1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg/trajectory_ir", "drivers", "client"]

[tool.pytest.ini_options]
testpaths = ["test", "conformance"]
pythonpath = ["pkg", "."]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pkg", "drivers", "client", "test", "conformance", "examples"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PIE",
    "RET",
]


[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.isort]
known-first-party = ["trajectory_ir", "drivers", "client", "test"]

[tool.mypy]
python_version = "3.11"
mypy_path = "pkg:."
packages = ["trajectory_ir", "client", "drivers"]
warn_unused_configs = true
show_error_codes = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
warn_redundant_casts = true
no_implicit_reexport = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore.*",
    "rfc8785",
]
ignore_missing_imports = true

