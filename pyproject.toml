[project]
name = "trajectory-ir"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dbos",
    "rfc8785",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pip-audit"]
s3 = ["boto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg/trajectory_ir", "drivers", "client"]

[tool.pytest.ini_options]
testpaths = ["test", "conformance"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pkg", "drivers", "client", "test", "conformance", "examples"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Fixture agent adjusts sys.path before local imports on purpose.
"examples/kill-mid-deploy/agent.py" = ["E402"]
"examples/host_loop/run_host.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["trajectory_ir", "drivers", "client", "test"]

[tool.mypy]
python_version = "3.11"
mypy_path = "pkg"
packages = ["trajectory_ir"]
warn_unused_configs = true
show_error_codes = true
